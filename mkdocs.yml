site_name: The Four Ages of AI
site_description: From Machine Intelligence to Human Reinvention
site_url: https://rooagi.github.io/The-Four-Ages-of-AI-From-Machine-Intelligence-to-Human-Reinvention/
repo_url: https://github.com/RooAGI/The-Four-Ages-of-AI-From-Machine-Intelligence-to-Human-Reinvention
repo_name: RooAGI / The Four Ages of AI
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Age 1 · Alchemy: age-1-alchemy.md
  - Age 2 · Large Language Models: age-2-llms.md
  - Age 3 · Agentic Computing: age-3-agentic-computing.md
  - Age 4 · Scientific Renaissance: age-4-scientific-renaissance.md
  - Human Reinvention: human-reinvention.md
  - References: references.md
